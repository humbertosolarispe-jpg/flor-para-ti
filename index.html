<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Un loto para ti 🌸</title>
    <style>
        /* --- ESTILOS BASE Y VARIABLES --- */
        *, ::after, ::before { padding: 0; margin: 0; box-sizing: border-box; }
        html { width: 100%; height: 100%; overflow: hidden; }
        :root {
            --dark-color: #050b14;
            --petal-color-light: #ffc2eb;
            --petal-color-dark: #d5006d;
            --center-glow: #ffdf00;
            --leaf-color-main: #00897b;
            --leaf-color-dark: #004d40;
            --stem-color-light: #26a69a;
            --stem-color-dark: #00695c;
            --stem-growth: 0;
            --leaf-growth: 0;
            --flower-growth: 0;
        }
        body {
            display: flex; align-items: flex-end; justify-content: center;
            height: 100%; width: 100%; background-color: var(--dark-color);
            overflow: hidden; perspective: 1000px; font-family: Georgia, serif;
        }

        /* --- PANTALLA 1: PORTADA (PARA ACTIVAR MÚSICA) --- */
        #pantalla-inicio {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.9); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.5s ease;
        }
        #pantalla-inicio h1 {
            color: #ffc2eb; font-size: 2.5rem; margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 0, 150, 0.6); text-align: center;
        }
        #pantalla-inicio p { color: #e0f2f1; margin-bottom: 30px; text-align: center; }
        #btn-iniciar {
            padding: 15px 40px; border: none; border-radius: 30px;
            background: linear-gradient(135deg, #d5006d, #ffc2eb);
            color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px rgba(213, 0, 109, 0.6); transition: transform 0.3s;
        }
        #btn-iniciar:hover { transform: scale(1.05); }

        /* --- FONDO Y ESTRELLAS --- */
        .night {
            position: fixed; left: 50%; top: 0; transform: translateX(-50%);
            width: 100%; height: 100%;
            background-image: radial-gradient(ellipse at bottom, rgba(0,150,255,.15) 0, transparent 50%), linear-gradient(to bottom, #020111 0, #10152b 50%, #061c2d 100%);
        }
        .water-surface {
            position: absolute; bottom: 0; width: 100%; height: 25vh;
            background: linear-gradient(to top, rgba(0,255,200,.05), transparent);
            border-top: 1px solid rgba(255,255,255,.05); z-index: 1;
        }
        .star {
            position: fixed; top: 0; left: 0; width: 2px; height: 2px;
            background-color: #fff; border-radius: 50%;
            box-shadow: 0 0 5px #fff, 0 0 10px rgba(0,255,255,.5);
            animation: twinkle 5s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: .3; transform: scale(.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- FLORES (LOTO) --- */
        .flowers { position: relative; transform: scale(.9); z-index: 5; }
        .flower { position: absolute; bottom: 10vmin; transform-origin: bottom center; z-index: 10; }
        .flower--1 { animation: moving-flower-1 5s ease-in-out infinite alternate; }
        .flower--1 .flower__line { height: 55vmin; }
        .flower--2 { left: 50%; transform: rotate(15deg); animation: moving-flower-2 6s ease-in-out infinite alternate; }
        .flower--2 .flower__line { height: 45vmin; }
        .flower--3 { left: 50%; transform: rotate(-15deg); animation: moving-flower-3 5.5s ease-in-out infinite alternate; }
        .flower--3 .flower__line { height: 50vmin; }
        
        .flower__leafs {
            position: relative; transform: scale(var(--flower-growth));
            transform-origin: bottom center; transition: transform .2s ease-out;
        }
        .flower__leafs::after {
            content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
            width: 6vmin; height: 6vmin; background-color: var(--center-glow);
            border-radius: 50%; filter: blur(2vmin); z-index: 4;
        }
        .flower__leaf {
            position: absolute; bottom: 0; left: 50%; width: 9vmin; height: 14vmin;
            border-radius: 50% 50% 20% 20% / 70% 70% 30% 30%;
            background-image: linear-gradient(to top, var(--petal-color-dark) 10%, var(--petal-color-light) 90%);
            transform-origin: bottom center; box-shadow: inset 0 0 1.5vmin rgba(255,255,255,.4);
        }
        .flower__leaf:first-child { transform: translateX(-50%) rotate(0); z-index: 3; }
        .flower__leaf:nth-child(2) { transform: translateX(-100%) rotate(-35deg) translateY(2vmin); z-index: 2; }
        .flower__leaf:nth-child(3) { transform: translateX(0) rotate(35deg) translateY(2vmin); z-index: 2; }
        .flower__leaf:nth-child(4) { transform: translateX(-140%) rotate(-70deg) translateY(7vmin); z-index: 1; background-image: linear-gradient(to top, var(--petal-color-dark), #ff8fab); }
        .flower__leaf:nth-child(5) { transform: translateX(40%) rotate(70deg) translateY(7vmin); z-index: 1; }
        
        .flower__line {
            width: 1.8vmin; height: calc(1% * var(--stem-growth)); transition: height .2s ease-out;
            background-image: linear-gradient(to left, rgba(0,0,0,.3), transparent, rgba(255,255,255,.2)), linear-gradient(to top, transparent 5%, var(--stem-color-dark), var(--stem-color-light));
            border-radius: 2vmin;
        }
        .flower__line__leaf {
            --w: 12vmin; --h: 9vmin; position: absolute; top: 30%; left: 100%;
            width: var(--w); height: var(--h); border-radius: 50% 50% 40% 40%;
            background-image: linear-gradient(to top, var(--leaf-color-dark), var(--leaf-color-main));
            transition: transform .2s ease-out;
        }
        .flower__line__leaf--1 { transform: rotate(20deg) rotateX(50deg) scale(var(--leaf-growth)); transform-origin: left; }
        .flower__line__leaf--2 { top: 60%; transform: rotate(15deg) rotateX(60deg) scale(var(--leaf-growth)); transform-origin: left; }
        .flower__line__leaf--3, .flower__line__leaf--4 { left: -700%; top: 20%; transform: rotate(-20deg) rotateX(50deg) scale(var(--leaf-growth)); transform-origin: right; }
        .flower__line__leaf--4 { top: 65%; }

        .flower__light {
            position: absolute; bottom: 0; width: 1vmin; height: 1vmin;
            background-color: var(--center-glow); border-radius: 50%; filter: blur(.2vmin);
            animation: light-ans 4s linear infinite backwards;
        }
        .flower__light:nth-child(odd) { background-color: #fff; }
        .flower__light--1 { left: -2vmin; animation-delay: 1s; }
        .flower__light--2 { left: 3vmin; animation-delay: .5s; }
        .flower__light--3 { left: -6vmin; animation-delay: .3s; }
        .flower__light--4 { left: 6vmin; animation-delay: .9s; }

        @keyframes light-ans {
            0% { opacity: 0; transform: translateY(0); }
            25% { opacity: 1; transform: translateY(-5vmin) translateX(-2vmin); }
            50% { opacity: 1; transform: translateY(-15vmin) translateX(2vmin); filter: blur(.2vmin); }
            75% { transform: translateY(-20vmin) translateX(-2vmin); filter: blur(.2vmin); }
            100% { transform: translateY(-30vmin); opacity: 0; filter: blur(1vmin); }
        }
        @keyframes moving-flower-1 { 0% { transform: rotate(2deg); } 100% { transform: rotate(-2deg); } }
        @keyframes moving-flower-2 { 0% { transform: rotate(18deg); } 100% { transform: rotate(12deg); } }
        @keyframes moving-flower-3 { 0% { transform: rotate(-18deg); } 100% { transform: rotate(-12deg); } }
        
        /* Detiene las animaciones hasta que se presiona el botón */
        .not-loaded * { animation-play-state: paused !important; }

        /* --- TARJETA DEL POEMA --- */
       
        @keyframes glowTitle {
            from { opacity: 0.7; transform: scale(1); text-shadow: 0 0 5px rgba(255, 0, 150, 0.4); }
            to { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px rgba(255, 0, 150, 0.9); }
        }
        #poem-text {
            color: #e0f2f1; font-family: Georgia, serif; font-style: italic;
            font-size: 1.15rem; line-height: 1.8; white-space: pre-wrap;
            text-shadow: 0 2px 4px rgba(0,0,0,.8); text-align: center;
        }
        /* Cursor parpadeante del texto */
        #poem-text::after {
            content: '|'; margin-left: 5px; opacity: 1; color: #0fc;
            animation: blink-caret .75s step-end infinite;
        }
        @keyframes blink-caret { from, to { opacity: 1; } 50% { opacity: 0; } }
        #poem-text.typing-done::after { animation: none; opacity: 0; }

        /* --- RESPONSIVO PARA CELULARES --- */
        @media (max-width: 1024px) {
            .poem-card { top: 8vh; left: 50%; right: auto; transform: translateX(-50%); width: 90%; max-width: 550px; }
            .flowers { transform: scale(.95); bottom: 5vmin; }
        }
        @media (max-width: 768px) {
            .poem-card { width: 90vw; }
            .flowers { transform: scale(.85); bottom: 8vmin; }
        }
        @media (max-width: 480px) {
            .flowers { transform: scale(.8); bottom: 12vmin; }
            #poem-text { font-size: 1rem; }
        }
    </style>
</head>
<body class="not-loaded">

        <!-- MÚSICA DE FONDO -->
    <audio id="musica-fondo" loop>
        <source src="angel_.mp3" type="audio/mpeg">
    </audio>

    <!-- PANTALLA 1: INICIO -->
    <div id="pantalla-inicio">
        <h1>Un loto para ti</h1>
        <p>Presiona el botón🌸</p>
        <button id="btn-iniciar">Comenzar ✨</button>
    </div>

    <!-- PANTALLA 2: LA FLOR Y EL POEMA -->
    <div class="night">
        <div class="water-surface"></div>
    </div>
    
    <div class="flowers">
        <!-- Flor 1 -->
        <div class="flower flower--1">
            <div class="flower__leafs flower__leafs--1">
                <div class="flower__leaf"></div><div class="flower__leaf"></div><div class="flower__leaf"></div><div class="flower__leaf"></div><div class="flower__leaf"></div>
                <div class="flower__light flower__light--1"></div><div class="flower__light flower__light--2"></div><div class="flower__light flower__light--3"></div><div class="flower__light flower__light--4"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div><div class="flower__line__leaf flower__line__leaf--3"></div><div class="flower__line__leaf flower__line__leaf--4"></div>
            </div>
        </div>
        <!-- Flor 2 -->
        <div class="flower flower--2">
            <div class="flower__leafs flower__leafs--2">
                <div class="flower__leaf"></div><div class="flower__leaf"></div><div class="flower__leaf"></div><div class="flower__leaf"></div><div class="flower__leaf"></div>
                <div class="flower__light flower__light--1"></div><div class="flower__light flower__light--2"></div><div class="flower__light flower__light--3"></div><div class="flower__light flower__light--4"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div><div class="flower__line__leaf flower__line__leaf--3"></div><div class="flower__line__leaf flower__line__leaf--4"></div>
            </div>
        </div>
        <!-- Flor 3 -->
        <div class="flower flower--3">
            <div class="flower__leafs flower__leafs--3">
                <div class="flower__leaf"></div><div class="flower__leaf"></div><div class="flower__leaf"></div><div class="flower__leaf"></div><div class="flower__leaf"></div>
                <div class="flower__light flower__light--1"></div><div class="flower__light flower__light--2"></div><div class="flower__light flower__light--3"></div><div class="flower__light flower__light--4"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div><div class="flower__line__leaf flower__line__leaf--3"></div><div class="flower__line__leaf flower__line__leaf--4"></div>
            </div>
        </div>
    </div>

   

    <!-- JAVASCRIPT LIMPIO -->
    <script>
        // 1. EL TEXTO QUE SE VA A ESCRIBIR (Puedes cambiarlo aquí)
       
        const btnIniciar = document.getElementById('btn-iniciar');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const musica = document.getElementById('musica-fondo');

        // Al presionar el botón
        btnIniciar.addEventListener('click', () => {
            // Iniciar música
            musica.volume = 0.6;
            musica.play().catch(e => console.log("Audio bloqueado"));

            // Desaparecer pantalla de inicio
            pantallaInicio.style.opacity = '0';
            setTimeout(() => pantallaInicio.style.display = 'none', 1500);

            // Quitar la clase que pausa las animaciones
            document.body.classList.remove('not-loaded');

            // Iniciar la animación de crecimiento de la flor
            animarCrecimiento();

          
            // Crear estrellas
            crearEstrellas();
        });

        // Función para que la flor "crezca"
        function animarCrecimiento() {
            let progress = 0;
            const interval = setInterval(() => {
                progress += 0.02;
                if (progress >= 1) {
                    progress = 1;
                    clearInterval(interval);
                }
                // Actualizar variables CSS
                document.documentElement.style.setProperty('--stem-growth', progress * 100);
                document.documentElement.style.setProperty('--leaf-growth', progress);
                document.documentElement.style.setProperty('--flower-growth', progress);
            }, 30);
        }

        // Función para escribir el texto letra por letra
        

        // Función para crear las estrellas de fondo
        function crearEstrellas() {
            const night = document.querySelector('.night');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                night.appendChild(star);
            }
        }
    </script>
</body>
</html>
